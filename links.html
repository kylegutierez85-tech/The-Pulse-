<html>
<head>
<style>
    body { 
        background-color: #0f172a; 
        font-family: 'Segoe UI', sans-serif; 
        margin: 0;
        width: 100%;
        height: 100%;
        color: white;
        overflow: hidden;
    }

    #splash-screen {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }

    #terminal-links {
        display: none;
        padding: 60px 40px;
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        overflow-y: auto;
    }

    #page-display {
        display: none;
        width: 100%;
        height: 100vh;
        border: none;
    }

    .nav-btn { 
        display: block; 
        padding: 20px; 
        margin: 15px 0; 
        background: #1e293b; 
        color: #38bdf8; 
        text-decoration: none; 
        border: 1px solid #38bdf8;
        border-radius: 8px; 
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        cursor: pointer;
    }

    .nav-btn:hover { background: #38bdf8; color: #0f172a; }

    .enter-btn {
        padding: 25px 60px;
        font-size: 24px;
        background: transparent;
        border: 3px solid #0074D9;
        cursor: pointer;
        color: white;
        border-radius: 50px;
    }
</style>
</head>
<body>

    <div id="splash-screen">
        <h1 style="color: #38bdf8;">THE URBAN PULSE</h1>
        <button class="enter-btn" onclick="showLinks()">Enter City Terminal</button>
    </div>

    <div id="terminal-links">
        <div class="nav-btn" onclick="loadPage('body.html')">HOME BASE</div>
        <div class="nav-btn" onclick="loadPage('transport.html')">TRANSPORTATION</div>
        <div class="nav-btn" onclick="loadPage('flow.html')">CITY FLOW</div>
        <div class="nav-btn" onclick="loadPage('sensors .html')">SMART SENSORS</div>
        <div class="nav-btn" onclick="loadPage('game.html')" style="background: #2ECC40; border:none; color:white;">🕹️ BOOT GAME</div>
    </div>

    <iframe id="page-display" src=""></iframe>

    <script>
        const splash = document.getElementById('splash-screen');
        const links = document.getElementById('terminal-links');
        const display = document.getElementById('page-display');

        function showLinks() {
            splash.style.display = 'none';
            display.style.display = 'none';
            links.style.display = 'block';
        }

        function loadPage(url) {
            links.style.display = 'none';
            display.src = url;
            display.style.display = 'block';
        }
    </script>

</body>
</html>
